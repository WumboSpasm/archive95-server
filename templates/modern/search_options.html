<div class="archive95-search-options">
	<fieldset>
		<legend>Search fields</legend>
		<input type="checkbox" id="fieldTitle" name="field" value="title"{FIELDTITLE}>
		<label for="fieldTitle">Title</label>
		<br>
		<input type="checkbox" id="fieldContent" name="field" value="content"{FIELDCONTENT}>
		<label for="fieldContent">Content</label>
		<br>
		<input type="checkbox" id="fieldUrl" name="field" value="url"{FIELDURL}>
		<label for="fieldUrl">URL</label>
	</fieldset>
	<fieldset>
		<legend>Search formats</legend>
		<input type="checkbox" id="formatHtml" name="format" value="html"{FORMATHTML}>
		<label for="formatHtml">HTML</label>
		<br>
		<input type="checkbox" id="formatPlaintext" name="format" value="plaintext"{FORMATPLAINTEXT}>
		<label for="formatPlaintext">Plaintext</label>
		<br>
		<input type="checkbox" id="formatBinary" name="format" value="binary"{FORMATBINARY}>
		<label for="formatBinary">Binary</label>
	</fieldset>
	<fieldset>
		<legend>Search includes</legend>
		<input type="checkbox" id="includeOrphans" name="include" value="orphans"{INCLUDEORPHANS}>
		<label for="includeOrphans">Orphans</label>
		<br>
		<input type="checkbox" id="includeBroken" name="include" value="broken"{INCLUDEBROKEN}>
		<label for="includeBroken">Broken pages</label>
		<br>
		<input type="checkbox" id="includeErrors" name="include" value="errors"{INCLUDEERRORS}>
		<label for="includeErrors">Error pages</label>
	</fieldset>
	<fieldset>
		<legend>Search source</legend>
		<select id="source" name="source">
			<option value="">All sources</option>
			{SOURCES}
		</select>
	</fieldset>
	<div>
		<a href="/random"><img src="/images/modern/dice.gif" title="Take me to a random page"></a>
	</div>
</div>
